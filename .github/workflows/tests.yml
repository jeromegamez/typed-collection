name: Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
      - 'composer.json'
  push:
    branches: ['main']
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
      - 'composer.json'
  workflow_dispatch:

jobs:
  tests:
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        laravel: ["^11.0", "^12.0"]
        include:
          - php: "8.6"
            laravel: "^12.0"
            composer-options: "--ignore-platform-req=php+"
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Setup Problem Matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install composer dependencies
        run: |
          composer require "illuminate/collections:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --with-all-dependencies --prefer-dist --no-interaction ${{ matrix.composer-options }}

      - name: Run tests
        run: php vendor/bin/phpunit --testdox

      - name: Run PHPStan
        run: php vendor/bin/phpstan --error-format=github
